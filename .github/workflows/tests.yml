name: Mobile tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 12 * * 1"   # weekly
  workflow_dispatch:

env:
  APP_VERSION: "2.3.0"
  APP_FILE: mda-2.3.0-27.apk
  APPIUM_VERSION: "3.9.0"
  UIAUTOMATOR2_VERSION: "8.7.3"

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium@${APPIUM_VERSION}
          appium driver install uiautomator2@${UIAUTOMATOR2_VERSION}

      - name: Download My Demo App
        run: |
          mkdir -p apps
          curl -sSfL -o apps/mda.apk \
            "https://github.com/saucelabs/my-demo-app-android/releases/download/${APP_VERSION}/${APP_FILE}"

      - name: Run suite on an Android 12 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          cores: 3
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ci_run.sh

      - name: Upload report and Appium log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            reports/
            appium.log
